name: MR Minah BTC
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mr-minah-btc
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python btc.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
      - run: |
          git config user.name "mr-minah-bot"
          git config user.email "mr-minah-bot@users.noreply.github.com"
          git add btc_trades.json
          git diff --cached --quiet || (git commit -m "update trades" && (git push || (git pull --rebase && git push)))
